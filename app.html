    /* ==================================================================
       首页「我的工作台」视觉层 v2
       原则：一色主导（沿用 #3d5a80 主色梯度）· 状态即颜色 · 层级靠尺寸与留白
       九张板块卡一律白底，只用「顶部 3px 色条 + 图标色 + 数字色」区分类别
       ================================================================== */

    /* ---------- 页面根容器 & 身份色 ---------- */
    .wb-page{display:block}
    .wb-id--province{--id-color:var(--color-primary-800)}
    .wb-id--city    {--id-color:var(--color-primary-600)}
    .wb-id--county  {--id-color:var(--color-primary-400)}
    .wb-id--hospital{--id-color:var(--color-accent)}
    .wb-id--admin   {--id-color:var(--color-gray-600)}

    /* ---------- 通用图标 ---------- */
    .wb-ico{width:18px;height:18px;flex:0 0 18px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .wb-ico--sm{width:14px;height:14px;flex-basis:14px}
    .wb-ico--lg{width:20px;height:20px;flex-basis:20px}

    /* ---------- L2 页面上下文栏 ---------- */
    /* ---------- 小节标题 ---------- */
    .wb-section-title{display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-h3);
      font-weight:var(--fw-semibold);color:var(--color-text-title);letter-spacing:0;
      margin:var(--space-8) 0 var(--space-4)}
    .wb-section-title::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary)}
    .wb-section-title .sub{font-size:var(--fs-xs);font-weight:var(--fw-regular);color:var(--color-text-muted)}

    /* ---------- 12 列栅格 ---------- */
    .wb-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--space-5);align-items:start}
    /* 首页主布局：左右两列「各自独立堆叠」
       左列(8) 今日聚焦 → 排行榜；右列(4) 咨询栏 → 指标区。
       注意：不能把四张卡直接铺在同一个栅格里按上下两排摆放——CSS Grid 同一行的
       所有单元格强制共享行高，短卡下方会被高卡撑出大片空白（即"墓地"现象）。
       因此这里用两个列容器各自 flex 纵向排列，两列高度互不影响。 */
    .wb-col{display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
    .wb-col--main{grid-column:span 6}
    .wb-col--side{grid-column:span 6}
    .wb-c-full{grid-column:1/-1}
    /* 超管视图：健康灯整排；治理清单 + 关键指标 + 咨询栏 同排
       （超管的咨询栏是栅格直接子项，故 .wb-c-consult 的跨列声明必须保留） */
    .wb-c-consult{grid-column:span 4}
    .wb-c-health{grid-column:span 12}
    .wb-c-govern{grid-column:span 5}
    .wb-c-govstat{grid-column:span 3}
    /* 旧九宫格类保留（wbBlockCard 仍可复用），不再参与首页主布局 */
    .wb-c-today{grid-column:span 6}
    .wb-c-month,.wb-c-done,.wb-c-supply,.wb-c-confirm,.wb-c-returned,.wb-c-followup{grid-column:span 3}
    .wb-c-quality{grid-column:span 5}
    .wb-c-errors{grid-column:span 8}

    /* ---------- 板块卡 ---------- */
    .wb-card{position:relative;display:flex;flex-direction:column;min-height:200px;
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
      box-shadow:var(--shadow-xs);padding:var(--space-5);overflow:hidden;
      transition:border-color var(--dur-fast) var(--ease-in-out),box-shadow var(--dur-base) var(--ease-out),
                 transform var(--dur-base) var(--ease-out)}
    .wb-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
      background:var(--card-accent,var(--color-gray-300))}
    .wb-card:hover{border-color:var(--color-primary-200);box-shadow:var(--shadow-md);transform:translateY(-1px)}
    /* 色条映射：唯一的分类着色位置 */
    .wb-c-today   {--card-accent:var(--color-primary-600)}
    .wb-c-month   {--card-accent:var(--color-primary-500)}
    .wb-c-supply  {--card-accent:var(--color-primary-400)}
    .wb-c-confirm {--card-accent:var(--color-caution-solid)}
    .wb-c-returned{--card-accent:var(--color-warning-solid)}
    .wb-c-followup{--card-accent:var(--color-accent)}
    .wb-c-quality {--card-accent:var(--color-danger-solid)}
    .wb-c-done    {--card-accent:var(--color-success-solid)}
    .wb-c-rank    {--card-accent:var(--color-gray-400)}
    .wb-c-errors  {--card-accent:var(--color-gray-400)}
    .wb-c-focus   {--card-accent:var(--color-primary-600)}
    .wb-c-consult {--card-accent:var(--color-accent)}
    .wb-c-metrics {--card-accent:var(--color-primary-300)}
    .wb-c-health,.wb-c-govern,.wb-c-govstat{--card-accent:var(--color-gray-600)}
    /* 焦点卡 */
    .wb-card--focus{border-color:var(--color-primary-200);box-shadow:var(--shadow-sm)}
    .wb-card--focus::before{height:4px}
    .wb-card--focus .wb-stat__value{font-size:var(--fs-display)}
    .wb-c-returned.wb-card--focus{border-color:var(--color-warning-border)}
    .wb-c-returned.wb-card--focus .wb-stat__value{font-size:var(--fs-stat-lg)}

    .wb-card__hd{display:flex;align-items:center;gap:var(--space-2);min-height:24px}
    .wb-card__icon{display:inline-flex;align-items:center;justify-content:center;
      color:var(--card-accent,var(--color-gray-400))}
    .wb-card__title{font-size:var(--fs-h2);font-weight:var(--fw-semibold);color:var(--color-text-title);
      line-height:var(--lh-snug)}
    .wb-card__hd .wb-badge{margin-left:auto}
    .wb-card__sub{font-size:var(--fs-xs);color:var(--color-text-muted);margin-top:2px}
    .wb-card__list{display:flex;flex-direction:column;gap:var(--space-1);margin-top:var(--space-2);flex:1}
    .wb-card__ft{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);
      margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px dashed var(--color-border);min-height:32px}

    /* ---------- 统计数字 ---------- */
    .wb-stat{display:flex;align-items:flex-end;flex-wrap:wrap;gap:var(--space-2);margin:var(--space-4) 0 var(--space-2)}
    .wb-stat__value{font-family:var(--font-num);font-size:var(--fs-stat);font-weight:var(--fw-black);
      line-height:var(--lh-tight);letter-spacing:var(--ls-tight);color:var(--color-gray-900);
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .wb-stat__value.is-zero{color:var(--color-gray-400)}
    .wb-stat__unit{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--color-text-muted);padding-bottom:4px}
    .wb-stat__chips{margin-left:auto;display:flex;align-items:center;gap:var(--space-1);padding-bottom:2px}
    /* 数字语义色（跟随板块） */
    .wb-c-confirm  .wb-stat__value{color:var(--color-caution-fg)}
    .wb-c-returned .wb-stat__value{color:var(--color-warning-fg)}
    .wb-c-quality  .wb-stat__value{color:var(--color-danger-fg)}
    .wb-c-done     .wb-stat__value{color:var(--color-success-fg)}
    /* 全局：所有统计型数字统一等宽，消除刷新抖动 */
    .wb-num,.wb-item__num,.wb-rank__count,.wb-err__count,.wb-govstat__num{
      font-family:var(--font-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
      letter-spacing:var(--ls-tight)}

    /* ---------- 徽章（形态 + 状态双维度） ---------- */
    .wb-badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;
      border-radius:var(--radius-pill);font-size:var(--fs-xs);font-weight:var(--fw-semibold);
      white-space:nowrap;line-height:1;flex:0 0 auto}
    .wb-badge--soft{background:var(--_bg,var(--color-neutral-bg));color:var(--_fg,var(--color-neutral-fg));border:0}
    .wb-badge--outline{background:transparent;color:var(--_fg,var(--color-neutral-fg));
      border:1px solid var(--_bd,var(--color-neutral-border))}
    .wb-badge--solid{background:var(--_solid,var(--color-neutral-solid));color:#fff;border:0}

    /* ---------- 状态圆点：形状 + 颜色双编码 ---------- */
    .wb-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--_solid,var(--color-neutral-solid));
      box-sizing:border-box}
    .wb-dot--hollow{background:transparent;border:2px solid var(--_solid,var(--color-neutral-solid))}
    .wb-dot--pulse{position:relative;animation:wbPulse 2s var(--ease-in-out) infinite}
    @keyframes wbPulse{0%{box-shadow:0 0 0 0 rgba(220,53,69,.5)}70%{box-shadow:0 0 0 6px rgba(220,53,69,0)}100%{box-shadow:0 0 0 0 rgba(220,53,69,0)}}
    @media(prefers-reduced-motion:reduce){.wb-dot--pulse{animation:none}}

    /* ---------- 列表项 ---------- */
    .wb-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);
      border-radius:var(--radius-md);font-size:var(--fs-body);color:var(--color-text-body);background:transparent;
      transition:background var(--dur-fast) var(--ease-in-out),color var(--dur-fast) var(--ease-in-out)}
    .wb-item.is-clickable{cursor:pointer}
    .wb-item.is-clickable:hover{background:var(--color-gray-50)}
    .wb-item.is-clickable:hover .wb-item__text{color:var(--primary)}
    .wb-item--p0{box-shadow:inset 2px 0 0 var(--color-danger-solid)}
    .wb-item--p0 .wb-item__text{color:var(--color-danger-fg);font-weight:var(--fw-semibold)}
    .wb-item__text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .wb-item__meta{font-size:var(--fs-sm);color:var(--color-text-muted);flex:0 0 auto;max-width:44%;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .wb-item__num{font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--color-text-title);flex:0 0 auto}

    /* ---------- 卡内按钮 / 链接 ---------- */
    .wb-link{border:0;background:transparent;padding:0;font-size:var(--fs-sm);font-weight:var(--fw-medium);
      color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
    .wb-link:hover{text-decoration:underline}
    .wb-link:focus-visible{outline:0;box-shadow:var(--shadow-focus);border-radius:var(--radius-xs)}
    .wb-link--muted{color:var(--color-text-muted)}
    .wb-link--muted:hover{color:var(--primary)}
    .wb-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;
      border:1px solid transparent;border-radius:var(--radius-sm);font-size:var(--fs-sm);
      font-weight:var(--fw-medium);font-family:inherit;cursor:pointer;white-space:nowrap;
      transition:background var(--dur-fast) var(--ease-in-out),border-color var(--dur-fast) var(--ease-in-out)}
    .wb-btn--primary{background:var(--primary);color:#fff}
    .wb-btn--primary:hover{background:var(--color-primary-hover)}
    .wb-btn--orange{background:var(--color-warning-solid);color:#fff}
    .wb-btn--orange:hover{background:var(--color-warning-fg)}
    .wb-btn:focus-visible{outline:0;box-shadow:var(--shadow-focus)}

    /* ---------- 空态 ---------- */
    .wb-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);
      flex:1;min-height:88px;padding:var(--space-4) 0;color:var(--color-text-muted);font-size:var(--fs-body)}
    .wb-empty__ico{width:40px;height:40px;border-radius:var(--radius-md);background:var(--color-gray-100);
      display:flex;align-items:center;justify-content:center;color:var(--color-success-solid)}

    /* ---------- 排名卡 ---------- */
    .wb-rank{display:flex;flex-direction:column;gap:2px;margin-top:var(--space-1);flex:1}
    .wb-rank__head{display:grid;grid-template-columns:26px minmax(140px,1fr) 76px minmax(180px,300px);
      gap:var(--space-3);padding:2px var(--space-2) 0;margin-top:var(--space-2);
      color:var(--color-text-muted);font-size:var(--fs-2xs)}
    .wb-rank__head span{text-align:center}
    .wb-rank__head span:nth-child(2){text-align:left}
    .wb-rank__head span:last-child{text-align:right}
    .wb-rank__dim{margin-left:auto;flex:0 0 auto;height:26px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--color-bg-surface);color:var(--color-text-body);font-size:var(--fs-xs);cursor:pointer}
    .wb-rank__dim:hover{border-color:var(--color-primary-400)}
    .wb-rank__dim:focus{outline:none;border-color:var(--color-primary-400);box-shadow:0 0 0 2px rgba(77,109,150,.12)}
    /* 排行榜加宽：进度条轨道目标宽度 ≈300px */
    .wb-rank__row{display:grid;grid-template-columns:26px minmax(140px,1fr) 76px minmax(180px,300px);
      align-items:center;gap:var(--space-3);height:42px;padding:0 var(--space-2);
      border-radius:var(--radius-md);cursor:pointer;
      transition:background var(--dur-fast) var(--ease-in-out)}
    .wb-rank__row:hover{background:var(--color-gray-50)}
    .wb-rank--count .wb-rank__row{grid-template-columns:26px minmax(140px,1fr) minmax(180px,300px) 56px}
    .wb-rank--count .wb-rank__head{grid-template-columns:26px minmax(140px,1fr) minmax(180px,300px) 56px}
    .wb-rank__idx{width:22px;height:22px;border-radius:50%;background:var(--color-gray-100);
      color:var(--color-gray-500);display:inline-flex;align-items:center;justify-content:center;
      font-size:var(--fs-2xs);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums}
    .wb-rank__row--m1 .wb-rank__idx{background:#faf0d2;color:#8a6100}
    .wb-rank__row--m2 .wb-rank__idx{background:var(--color-gray-100);color:var(--color-gray-600)}
    .wb-rank__row--m3 .wb-rank__idx{background:#f6e7dc;color:#8a5230}
    .wb-rank__name{display:flex;align-items:center;gap:6px;min-width:0}
    .wb-rank__name>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-body)}
    .wb-rank__bar{height:10px;border-radius:var(--radius-pill);background:var(--color-gray-100);overflow:hidden}
    .wb-rank__fill{display:block;height:100%;border-radius:inherit;background:var(--color-primary-500);
      min-width:3px;transition:width var(--dur-slow) var(--ease-out)}
    .wb-rank__count{text-align:right;font-size:var(--fs-sm);font-weight:var(--fw-semibold);
      color:var(--color-text-title)}
    .wb-rank__metric{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
    .wb-rank__metric i{font-style:normal;font-size:var(--fs-2xs);color:var(--color-text-muted)}
    .wb-rank__metric b{font-size:var(--fs-sm);font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums}
    .wb-rank__metric b.is-good{color:var(--color-success-solid)}
    .wb-rank__metric b.is-mid{color:var(--color-warning-solid)}
    .wb-rank__metric b.is-bad{color:var(--color-danger-solid)}
    .wb-rank__row--zero{background:var(--color-danger-bg)}
    .wb-rank__row--zero:hover{background:#fbdde2}
    .wb-rank__row--zero .wb-rank__idx{background:var(--color-danger-solid);color:#fff}
    .wb-rank__row--zero .wb-rank__name>span{color:var(--color-danger-fg);font-weight:var(--fw-semibold)}
    .wb-rank__row--zero .wb-rank__fill{background:var(--color-danger-solid)}
    .wb-rank__row--low .wb-rank__idx{background:var(--color-warning-bg);color:var(--color-warning-fg)}
    .wb-rank__row--low .wb-rank__fill{background:var(--color-warning-solid)}

    /* ---------- 常见错误提示 ---------- */
    .wb-err-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);
      margin-top:var(--space-3)}
    .wb-err{position:relative;padding:var(--space-3) var(--space-4);border:1px solid var(--border);
      border-radius:var(--radius-md);cursor:pointer;background:var(--surface);
      transition:border-color var(--dur-fast) var(--ease-in-out),box-shadow var(--dur-fast) var(--ease-out)}
    .wb-err:hover{border-color:var(--color-primary-200);box-shadow:var(--shadow-xs)}
    .wb-err__hd{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
    .wb-err__count{font-size:var(--fs-sm);font-weight:var(--fw-bold);color:var(--color-text-title)}
    .wb-err__count em{font-style:normal;font-weight:var(--fw-regular);color:var(--color-text-muted);
      font-size:var(--fs-xs);margin-left:2px}
    .wb-err__text{margin-top:6px;font-size:var(--fs-body);color:var(--color-text-body);line-height:var(--lh-snug);
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    /* ---------- 今日聚焦：可处理待办合并列表 ---------- */
    .wb-focus{display:flex;flex-direction:column;margin-top:var(--space-3);flex:1}
    .wb-focus__row{display:grid;grid-template-columns:8px 20px minmax(0,1fr) auto auto;align-items:center;
      gap:var(--space-3);min-height:58px;padding:var(--space-2) var(--space-3);
      border-radius:var(--radius-md);cursor:pointer;border:1px solid transparent;
      transition:background var(--dur-fast) var(--ease-in-out),border-color var(--dur-fast) var(--ease-in-out)}
    .wb-focus__row+.wb-focus__row{margin-top:var(--space-1)}
    .wb-focus__row:hover{background:var(--color-gray-50);border-color:var(--color-primary-200)}
    .wb-focus__ico{display:inline-flex;align-items:center;justify-content:center;color:var(--_solid,var(--color-gray-400))}
    .wb-focus__name{min-width:0;display:flex;flex-direction:column;gap:2px}
    .wb-focus__name b{font-size:var(--fs-h3);font-weight:var(--fw-semibold);color:var(--color-text-title);
      line-height:var(--lh-snug)}
    .wb-focus__name em{font-style:normal;font-size:var(--fs-xs);color:var(--color-text-muted);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .wb-focus__num{display:flex;align-items:baseline;gap:3px;justify-content:flex-end;min-width:72px;
      font-family:var(--font-num);font-size:var(--fs-stat);font-weight:var(--fw-black);
      line-height:var(--lh-tight);letter-spacing:var(--ls-tight);color:var(--_fg,var(--color-gray-900));
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .wb-focus__num i{font-style:normal;font-size:var(--fs-xs);font-weight:var(--fw-medium);
      color:var(--color-text-muted);letter-spacing:0}
    .wb-focus__num.is-zero{color:var(--color-gray-400)}
    .wb-focus__row .wb-btn{min-width:72px}
    .wb-focus-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,560px);gap:var(--space-5);align-items:stretch}
    .wb-notice-aside{--card-accent:var(--color-accent)}
    .wb-notice-aside .wb-news-body{flex:1;display:flex;flex-direction:column;min-height:0}
    .wb-notice-aside .wb-news-pane.is-active{display:flex;flex:1;flex-direction:column}
    .wb-notice-aside .wb-news-list{flex:1;align-content:start}
    .wb-notice-more{margin-left:auto;border:0;background:none;padding:0;cursor:pointer;font-family:inherit;font-size:var(--fs-xs);color:var(--color-text-muted);white-space:nowrap}
    .wb-notice-more:hover{color:var(--color-primary-700)}
    @media(max-width:1100px){.wb-focus-wrap{grid-template-columns:minmax(0,1fr)}}
    /* 语义色仅通过 --_fg/--_solid 下发给圆点·图标·数字，不做整行着色 */
    .wb-focus__row--supply  {--_fg:var(--color-warning-fg);--_solid:var(--color-warning-solid)}
    .wb-focus__row--confirm {--_fg:var(--color-caution-fg);--_solid:var(--color-caution-solid)}
    .wb-focus__row--followup{--_fg:var(--color-info-fg);--_solid:var(--color-info-solid)}
    .wb-focus__row--returned{--_fg:var(--color-danger-fg);--_solid:var(--color-danger-solid)}

    /* ---------- 资讯栏：Tab 面板（资讯 / 培训资料 / 技术指导 / 公告通知 / 调查问卷） ---------- */
    .wb-news-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:var(--space-3);
      padding-bottom:var(--space-2);border-bottom:1px solid var(--color-border)}
    .wb-news-tab{border:0;background:transparent;font-family:inherit;cursor:pointer;
      font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--color-text-muted);
      padding:6px 10px;border-radius:var(--radius-sm);line-height:1.2;
      transition:background var(--dur-fast) var(--ease-in-out),color var(--dur-fast) var(--ease-in-out)}
    .wb-news-tab:hover{background:var(--color-gray-50);color:var(--color-text-body)}
    .wb-news-tab.is-active{background:var(--color-primary-50);color:var(--color-primary-700);font-weight:var(--fw-semibold)}
    .wb-news-body{margin-top:var(--space-2)}
    .wb-news-pane{display:none}
    .wb-news-pane.is-active{display:block}
    .wb-news-list{display:flex;flex-direction:column;gap:2px}
    .wb-news-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-2);
      min-height:38px;padding:0 var(--space-2);border-radius:var(--radius-sm);cursor:default;
      transition:background var(--dur-fast) var(--ease-in-out)}
    .wb-news-row[onclick]{cursor:pointer}
    .wb-news-row:hover{background:var(--color-gray-50)}
    .wb-news-dot{width:7px;height:7px;border-radius:50%;background:var(--color-primary-400);flex:none}
    .wb-news-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-size:var(--fs-sm);color:var(--color-text-body);font-weight:var(--fw-medium)}
    .wb-news-meta{font-size:var(--fs-xs);color:var(--color-text-placeholder);white-space:nowrap;font-family:var(--font-num)}
    .wb-news-empty{padding:24px 0;text-align:center;color:var(--color-text-placeholder);font-size:var(--fs-sm)}

    /* ---------- 指标区：2×2 紧凑小卡 ---------- */
    .wb-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);
      margin-top:var(--space-3);flex:1;align-content:start}
    .wb-metric{display:flex;flex-direction:column;gap:2px;padding:var(--space-3);border:1px solid var(--border);
      border-radius:var(--radius-md);background:var(--color-gray-25);font-family:inherit;text-align:left;
      cursor:pointer;transition:border-color var(--dur-fast) var(--ease-in-out),background var(--dur-fast) var(--ease-in-out)}
    .wb-metric:hover{border-color:var(--color-primary-300);background:var(--surface)}
    .wb-metric__hd{display:flex;align-items:center;gap:6px;color:var(--_solid,var(--color-gray-400))}
    .wb-metric__label{font-size:var(--fs-xs);color:var(--color-text-muted)}

function findPath(items,id,path=[]){for(const item of items){const next=[...path,item];if(item.id===id)return next;if(item.children){const found=findPath(item.children,id,next);if(found)return found}}return null}

/* 板块卡：四段式（标题区 / 数字区 / 列表区 / 操作区）+ 顶部 3px 色条
   入参语义与调用关系保持不变；opts 仅新增视觉描述字段。 */
function wbBlockCard(title,num,items,opts){
  opts=opts||{};
  const urgent=opts.urgent;
  const key=opts.key||'';
  let cls='wb-card';
  if(key)cls+=' wb-c-'+key;
  if(opts.focus)cls+=' wb-card--focus';
  const dotTone=opts.dot||'info';
  const dotShape=opts.dotShape==='hollow'?' wb-dot--hollow':'';
  let hd='<div class="wb-card__hd"><span class="wb-card__icon">'+wbIco(opts.icon||'today')+'</span><span class="wb-card__title">'+title+'</span>';
  if(urgent&&opts.tag)hd+=wbBadge(opts.tag,opts.tagTone||'danger','soft');
  hd+='</div>';
  let stat='';
  if(num!==null&&num!==undefined){
    stat='<div class="wb-stat"><span class="wb-stat__value'+(num===0?' is-zero':'')+'">'+wbFmt(num)+'</span><span class="wb-stat__unit">'+(opts.unit||'项')+'</span>';
    if(opts.rate)stat+='<span class="wb-stat__chips">'+wbBadge(opts.rate,'success','soft')+'</span>';
    stat+='</div>';
  }
  let list;
  if(items&&items.length){
    list='<div class="wb-card__list">'+items.map(function(it){
      const p0=!!it.p;
      const tone=p0?'danger':dotTone;
      const shape=p0?' wb-dot--pulse':dotShape;
      const click=it.go?' onclick="navigateTo(\''+it.go+'\')"':'';
      let row='<div class="wb-item'+(it.go?' is-clickable':'')+(p0?' wb-item--p0':'')+'"'+click+'>';
      row+='<span class="wb-dot badge-'+tone+shape+'"></span>';
      row+='<span class="wb-item__text">'+it.title+'</span>';
      if(it.meta)row+='<span class="wb-item__meta">'+it.meta+'</span>';
      if(p0)row+=wbBadge('P0','danger','solid');
      if(it.flag)row+=wbBadge(it.flag,'danger','soft');
      row+='</div>';
      return row;
    }).join('')+'</div>';
  }else{
    list='<div class="wb-empty"><span class="wb-empty__ico">'+wbIco('check')+'</span><span>'+(opts.emptyText||'暂无待办，保持得不错')+'</span></div>';
  }
  let ft='';
  const act=opts.action;
  if(act){
    const go=act.go?' onclick="navigateTo(\''+act.go+'\')"':'';
    if(opts.focus){
      ft='<div class="wb-card__ft"><button class="wb-btn '+(opts.btnTone==='orange'?'wb-btn--orange':'wb-btn--primary')+'"'+go+'>'+act.label+'</button>'+
         '<button class="wb-link wb-link--muted"'+go+'>查看全部 ›</button></div>';
    }else{
      ft='<div class="wb-card__ft"><button class="wb-link"'+go+'>'+act.label+'</button>'+
         '<button class="wb-link wb-link--muted"'+go+'>查看全部 ›</button></div>';
    }
  }
  return '<div class="'+cls+'">'+hd+stat+list+ft+'</div>';
}

/* 排名卡：Grid 行布局 + 前三名奖牌色（零上报/低上报仅保留行级底色高亮，不再显示状态标签）
   mode:'complete'=完整性排名（按完整率降序，条形=完整率，行=排名·维度·完整率·条形，维度 单位/个人/区划 可切）；
   mode:'count'=上报数量排名（按上报量降序，条形=上报量，行=排名·维度·条形·上报量，维度可切） */
function wbRankCard(items,opts){
  if(!items||!items.length)return'';
  opts=opts||{};
  const lvl=opts.level||wbCtx.level;
  const mode=opts.mode||'count';
  const isComplete=mode==='complete';
  const tagMap={city:'区县',province:'市'};
  if(isComplete)items=items.slice().sort(function(a,b){return (parseFloat(b.complete)||0)-(parseFloat(a.complete)||0);});
  const max=isComplete?100:Math.max.apply(null,items.map(function(r){return r.count||0;}));
  const barVal=function(r){return isComplete?(parseFloat(r.complete)||0):(r.count||0);};
  const rows=items.map(function(r,i){
    let rc='wb-rank__row';
    if(r.count===0)rc+=' wb-rank__row--zero';
    else if(r.flag)rc+=' wb-rank__row--low';
    else if(i===0)rc+=' wb-rank__row--m1';
    else if(i===1)rc+=' wb-rank__row--m2';
    else if(i===2)rc+=' wb-rank__row--m3';
    const w=max?Math.round((barVal(r)/max)*100):0;
    let name='<span class="wb-rank__name"><span>'+r.name+'</span>';
    if(tagMap[lvl])name+=wbBadge(tagMap[lvl],'neutral','outline');
    name+='</span>';
    const cRate=r.complete||'-';
    const cPct=parseFloat(cRate)||0;
    const bar='<span class="wb-rank__bar"><i class="wb-rank__fill" style="width:'+w+'%"></i></span>';
    const metric=isComplete?'<span class="wb-rank__metric"><i>完整率</i><b class="'+(cPct>=90?'is-good':cPct>=80?'is-mid':'is-bad')+'">'+cRate+'</b></span>'+bar:bar+'<span class="wb-rank__count">'+wbFmt(r.count)+'</span>';
    return '<div class="'+rc+'" onclick="toast(\'查看：'+r.name+'\')">'+
      '<span class="wb-rank__idx">'+(i+1)+'</span>'+name+metric+'</div>';
  }).join('');
  const dimSel=function(state,setFn){return '<select class="wb-rank__dim" onchange="'+setFn+'(this.value)">'+Object.keys(wbRankDimDef).map(function(k){return '<option value="'+k+'"'+(k===state?' selected':'')+'>'+wbRankDimDef[k].label+'</option>';}).join('')+'</select>';};
  const countDim=wbRankDimGet();
  const compDim=wbRankDimDef[wbCompDim]||wbRankDimDef.unit;
  const head=isComplete?'<div class="wb-rank__head"><span></span><span>'+compDim.label+'</span><span>完整率</span><span></span></div>':'<div class="wb-rank__head"><span></span><span>'+countDim.label+'</span><span></span><span>上报量</span></div>';
  return '<div class="wb-card wb-c-rank'+(isComplete?'':' wb-rank--count')+'"><div class="wb-card__hd"><span class="wb-card__icon">'+wbIco('rank')+'</span>'+
    '<span class="wb-card__title">'+(isComplete?(compDim.label+'完整性排名'):(countDim.label+'上报数量排名'))+'</span>'+wbBadge('近 30 日','neutral','soft')+(isComplete?dimSel(wbCompDim,'wbSetCompDim'):dimSel(wbRankDim,'wbSetRankDim'))+'</div>'+
    head+
    '<div class="wb-rank">'+rows+'</div></div>';
}

/* 可处理待办的合并定义：待补充 / 待确认 / 待随访 / 被退回（医院无待随访） */
function wbFocusRows(b,isHosp){
  const def=[
    {key:'followup',label:'待随访',icon:'followup',desc:'初访 · 年度随访 · 逾期随访',src:b.followup,go:'followup-tasks'},
    {key:'report',label:'报告卡待处理',icon:'document',desc:'待补充 · 校验警告 · 被退回',src:b.returned,go:'collection-batch'},
    {key:'popupdate',label:'辖区人口数据更新',icon:'calendar',desc:'区域人口基线数据同步',src:b.supply,go:'master-pop'}
  ];
  return def.filter(function(r){

/* 今日聚焦卡：分组列表（状态圆点 + 图标 + 名称 + 大数字 + 处理按钮） */
function wbFocusCard(b,opts){
  opts=opts||{};

  let total=0;
  rows.forEach(function(r){total+=(r.src.num||0);});
  let hd='<div class="wb-card__hd"><span class="wb-card__icon">'+wbIco('bolt')+'</span>'+
    '<span class="wb-card__title">今日聚焦</span>'+
    wbBadge('待处理 '+wbFmt(total)+' 项',total>0?'danger':'success','soft')+'</div>'+
    '<div class="wb-card__sub">需我处理的可执行待办</div>';
  let list;
  if(rows.length){
    list='<div class="wb-focus">'+rows.map(function(r){
      const it=(r.src.items&&r.src.items.length)?r.src.items[0]:null;
      const go=(it&&it.go)?it.go:r.go;
      const n=r.src.num||0;
      const pulse=(r.key==='returned'&&n>0)?' wb-dot--pulse':'';
      let el='<div class="wb-focus__row wb-focus__row--'+r.key+'" onclick="navigateTo(\''+go+'\')">';
      el+='<span class="wb-dot'+pulse+'"></span>';
      el+='<span class="wb-focus__ico">'+wbIco(r.icon)+'</span>';
      el+='<span class="wb-focus__name"><b>'+r.label+'</b><em>'+r.desc+'</em></span>';
      el+='<span class="wb-focus__num'+(n===0?' is-zero':'')+'">'+wbFmt(n)+'<i>项</i></span>';
      el+='<button class="wb-btn '+(r.key==='returned'?'wb-btn--orange':'wb-btn--primary')+'" onclick="event.stopPropagation();navigateTo(\''+go+'\')">处理</button>';
      el+='</div>';
      return el;
    }).join('')+'</div>';
  }else{
    list='<div class="wb-empty"><span class="wb-empty__ico">'+wbIco('check')+'</span><span>暂无需处理的待办，保持得不错</span></div>';

}

function wbNewsTab(btn){
  const card=btn.closest('.wb-card');

  card.querySelectorAll('.wb-news-tab').forEach(function(t){t.classList.toggle('is-active',t===btn);});

    p.classList.toggle('is-active',p.getAttribute('data-pane')===id);

}

let regionSelected=[];
function renderRegionCascader(){const path=regionSelected.map(r=>r.label).join(' / ');return '<div class="region-cascader" id="regionCascader"><div class="region-cascader-input '+(path?'':'placeholder')+'" title="'+(path||'请选择行政区划')+'" onclick="toggleRegionCascader()">'+(path||'请选择行政区划')+'</div><span class="region-cascader-arrow">▾</span><div class="region-cascader-panel" id="regionCascaderPanel"></div></div>'}
function toggleRegionCascader(){const el=document.getElementById('regionCascader');el.classList.toggle('open');if(el.classList.contains('open'))renderRegionColumns()}
function renderRegionColumns(){const panel=document.getElementById('regionCascaderPanel');if(!panel)return;let html='';const levels=[regionData];for(let i=0;i<regionSelected.length;i++){const parent=regionSelected[i];const next=parent.children||[];if(!next.length)break;levels.push(next)}levels.forEach((items,depth)=>{html+='<div class="region-cascader-col">';items.forEach(item=>{const isActive=regionSelected[depth]&&regionSelected[depth].value===item.value;const hasChildren=item.children&&item.children.length;html+='<div class="region-cascader-col-item'+(isActive?' active':'')+'" onmouseover="hoverRegion('+depth+',\''+item.value+'\')" onclick="confirmRegion('+depth+',\''+item.value+'\')">'+item.label+(hasChildren?'<span class="col-arrow">▸</span>':'')+'</div>'});html+='</div>'});panel.innerHTML=html}
function hoverRegion(depth,value){const levels=[regionData];for(let i=0;i<depth;i++)levels.push(regionSelected[i].children||[]);const items=levels[depth];const found=items.find(r=>r.value===value);if(!found)return;regionSelected=regionSelected.slice(0,depth);regionSelected.push(found);renderRegionColumns();updateRegionInput()}
function confirmRegion(depth,value){const levels=[regionData];for(let i=0;i<depth;i++)levels.push(regionSelected[i].children||[]);const items=levels[depth];const found=items.find(r=>r.value===value);if(!found)return;regionSelected=regionSelected.slice(0,depth);regionSelected.push(found);updateRegionInput();if(!found.children||!found.children.length){setTimeout(()=>{document.getElementById('regionCascader')?.classList.remove('open')},100)}else{renderRegionColumns()}}
function updateRegionInput(){const path=regionSelected.map(r=>r.label).join(' / ');const input=document.querySelector('.region-cascader-input');if(input){input.textContent=path||'请选择行政区划';input.classList.toggle('placeholder',!path)}}
document.addEventListener('click',function(e){const cascader=document.getElementById('regionCascader');if(cascader&&!cascader.contains(e.target))cascader.classList.remove('open');document.querySelectorAll('.dr-picker.open').forEach(p=>{if(!p.contains(e.target))p.classList.remove('open')})});

function renderDateRangePicker(id,start,end){const text=start&&end?(start+' ~ '+end):'';return '<div class="dr-picker" id="'+id+'"><div class="dr-picker-input '+(text?'':'placeholder')+'" onclick="toggleDateRangePicker(\''+id+'\')">'+(text||'请选择日期区间')+'</div><span class="dr-picker-arrow">▾</span><div class="dr-picker-panel"><div class="dr-picker-presets"><span class="dr-picker-preset" onclick="applyDateRangePreset(\''+id+'\',\'today\')">今天</span><span class="dr-picker-preset" onclick="applyDateRangePreset(\''+id+'\',\'week\')">本周</span><span class="dr-picker-preset" onclick="applyDateRangePreset(\''+id+'\',\'month\')">本月</span><span class="dr-picker-preset" onclick="applyDateRangePreset(\''+id+'\',\'quarter\')">本季度</span><span class="dr-picker-preset" onclick="applyDateRangePreset(\''+id+'\',\'year\')">本年</span></div><div class="dr-picker-row"><label>开始</label><input type="date" id="'+id+'_start" value="'+(start||'')+'"></div><div class="dr-picker-row"><label>结束</label><input type="date" id="'+id+'_end" value="'+(end||'')+'"></div><div class="dr-picker-actions"><button class="btn btn-ghost btn-xs" onclick="clearDateRangePicker(\''+id+'\')">清除</button><button class="btn btn-primary btn-xs" onclick="confirmDateRangePicker(\''+id+'\')">确定</button></div></div></div>'}
function toggleDateRangePicker(id){const el=document.getElementById(id);if(el)el.classList.toggle('open')}
function applyDateRangePreset(id,preset){const now=new Date();let s,e;if(preset==='today'){s=e=now}else if(preset==='week'){const day=now.getDay()||7;s=new Date(now);s.setDate(now.getDate()-day+1);e=new Date(s);e.setDate(s.getDate()+6)}else if(preset==='month'){s=new Date(now.getFullYear(),now.getMonth(),1);e=new Date(now.getFullYear(),now.getMonth()+1,0)}else if(preset==='quarter'){const q=Math.floor(now.getMonth()/3);s=new Date(now.getFullYear(),q*3,1);e=new Date(now.getFullYear(),q*3+3,0)}else if(preset==='year'){s=new Date(now.getFullYear(),0,1);e=new Date(now.getFullYear(),11,31)}const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const ss=fmt(s),ee=fmt(e);const si=document.getElementById(id+'_start');const ei=document.getElementById(id+'_end');if(si)si.value=ss;if(ei)ei.value=ee;updateDateRangeInput(id,ss,ee)}
function updateDateRangeInput(id,start,end){const el=document.getElementById(id);const input=el?.querySelector('.dr-picker-input');if(!input)return;const text=start&&end?(start+' ~ '+end):'';input.textContent=text||'请选择日期区间';input.classList.toggle('placeholder',!text)}
function confirmDateRangePicker(id){const s=document.getElementById(id+'_start')?.value||'';const e=document.getElementById(id+'_end')?.value||'';updateDateRangeInput(id,s,e);const el=document.getElementById(id);if(el)el.classList.remove('open')}
function clearDateRangePicker(id){const si=document.getElementById(id+'_start');const ei=document.getElementById(id+'_end');if(si)si.value='';if(ei)ei.value='';updateDateRangeInput(id,'','')}
function getDateRangeValue(id){const s=document.getElementById(id+'_start')?.value||'';const e=document.getElementById(id+'_end')?.value||'';return{start:s,end:e}}
let _autoQueryTimer;function autoQuery(fn){clearTimeout(_autoQueryTimer);_autoQueryTimer=setTimeout(fn,300)}

function getVisibleHisRecords(){return hisRecords.filter(r=>r.validation!=='已处理').filter(r=>hisFilters.validation==='全部'||r.validation===hisFilters.validation).filter(r=>hisFilters.duplicate==='全部'||r.duplicate===hisFilters.duplicate).filter(r=>{if(!hisFilters.dateStart)return true;const field=hisFilters.dateType==='上传日期'?'uploadTime':hisFilters.dateType==='报告日期'?'reportDate':'diagnosisDate';const d=(r[field]||'').slice(0,10);return d===hisFilters.dateStart}).filter(r=>!hisFilters.keyword||[r.name,r.idNo,r.workUnit,r.inpatientNo,r.outpatientNo,r.icd10].some(v=>(v||'').includes(hisFilters.keyword)))}
function getHisSummary(){return {total:hisRecords.filter(r=>r.validation!=='已处理').length,importable:hisRecords.filter(r=>(r.validation==='通过'||r.validation==='警告')&&r.duplicate==='无重卡').length,error:hisRecords.filter(r=>r.validation==='错误').length,duplicate:hisRecords.filter(r=>r.duplicate==='疑似重卡').length}}
function hisBadge(text,type){return `<span class="badge badge-${type}">${text}</span>`}
function validationBadge(v){return v==='通过'?hisBadge(v,'success'):v==='警告'?hisBadge(v,'warning'):v==='错误'?hisBadge(v,'danger'):v==='已处理'?hisBadge(v,'muted'):hisBadge(v,'muted')}
function duplicateBadge(v){return v==='无重卡'?hisBadge(v,'success'):v==='疑似重卡'?hisBadge(v,'warning'):v==='已处理'?hisBadge(v,'info'):hisBadge(v,'muted')}
function renderHisTable(rows){if(!rows.length)return '<div class="empty-state">当前筛选条件下没有待处理 HIS 临时数据</div>';const headers=['校验状态','重卡状态','姓名','身份证号码','性别','年龄','出生日期','发病部位','ICD10','确诊日期','最后接触状态','最后接触时间','报告单位','报卡类型','来源类型','上传日期'];return `<div class="table-wrap"><table class="data-table" style="min-width:1760px"><thead><tr><th><input type="checkbox" onchange="toggleAllHisRows(this.checked)"></th>${headers.map(h=>`<th>${h}</th>`).join('')}<th class="sticky-col">操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" ${r.checked?'checked':''} onchange="toggleHisRow(${r.id},this.checked)"></td><td>${validationBadge(r.validation)}</td><td>${duplicateBadge(r.duplicate)}</td><td>${r.name}</td><td>${r.idNo}</td><td>${r.sex}</td><td>${r.age||'-'}</td><td>${r.birth}</td><td>${r.site}</td><td>${r.icd10||'-'}</td><td>${r.diagnosisDate}</td><td>${r.lastContactState||'-'}</td><td>${r.lastContactTime||'-'}</td><td>${r.reportUnit}</td><td>${r.cardType||'-'}</td><td>${r.uploadType||'HIS'}</td><td>${(r.uploadTime||'').slice(0,10)||'-'}</td><td class="sticky-col"><button class="btn btn-ghost btn-xs" onclick="cardListEdit(${r.id})">编辑</button> <button class="btn btn-ghost btn-xs" onclick="deleteHisRecord(${r.id})">删除</button></td></tr>`).join('')}</tbody></table></div>`}
function renderHisUploadManagement(){const visible=getVisibleHisRecords();const checkedCount=hisRecords.filter(r=>r.checked).length;return `<div class="page-toolbar"><div class="toolbar-actions"><button class="btn btn-import btn-sm" onclick="cardListAdd()">添加</button><button class="btn btn-import btn-sm" onclick="openBatchImportDialog()">批量登记</button><button class="btn btn-outline btn-sm" onclick="downloadTemplate()">模板下载</button></div></div><div class="panel"><div class="panel-body"><div class="filter-toolbar"><div class="form-group region-filter"><label>过滤行政区划</label>${renderRegionCascader()}</div><div class="form-group"><label>重卡状态</label><select id="hisDuplicateFilter" onchange="queryHisRecords()"><option>全部</option><option>无重卡</option><option>疑似重卡</option></select></div><div class="form-group"><label>校验状态</label><select id="hisValidationFilter" onchange="queryHisRecords()"><option>全部</option><option>通过</option><option>警告</option><option>错误</option></select></div><div class="form-group"><label>日期类型</label><select id="hisDateType" onchange="queryHisRecords()"><option>确诊日期</option><option>报告日期</option><option>上传日期</option></select></div><div class="form-group date-group"><label>日期</label>${renderDateRangePicker('dr_his',hisFilters.dateStart,hisFilters.dateStart)}</div><div class="form-group search-group"><label>检索内容</label><input id="hisKeyword" placeholder="姓名 / 身份证号 / 住院号" value="${hisFilters.keyword}" oninput="autoQuery(queryHisRecords)"></div><div class="filter-actions"><button class="btn btn-ghost btn-sm" onclick="resetHisFilters()">重置</button></div></div>${checkedCount>0?`<div class="void-batch-bar"><div class="void-batch-info">已选择 <strong>${checkedCount}</strong> 条记录（仅校验"通过"的可上传至报告卡列表）</div><div class="void-batch-actions"><button class="btn btn-outline btn-sm" onclick="exportSelectedHisExcel()">导出 Excel</button><button class="btn btn-primary btn-sm" onclick="hisBatchUpload()">批量上传</button><button class="btn btn-danger btn-sm" onclick="hisBatchDelete()">批量删除</button></div></div>`:''}${renderHisTable(visible)}</div></div>`}

function queryHisRecords(){hisFilters.validation=document.getElementById('hisValidationFilter')?.value||'全部';hisFilters.duplicate=document.getElementById('hisDuplicateFilter')?.value||'全部';hisFilters.dateType=document.getElementById('hisDateType')?.value||'确诊日期';const dr=getDateRangeValue('dr_his');hisFilters.dateStart=dr.start;hisFilters.keyword=(document.getElementById('hisKeyword')?.value||'').trim();renderPage('collection-batch')}
function resetHisFilters(){hisFilters={validation:'全部',duplicate:'全部',dateType:'确诊日期',dateStart:'',keyword:''};hisRecords.forEach(r=>r.checked=false);renderPage('collection-batch');toast('筛选条件已重置')}
function toggleHisRow(id,checked){const row=hisRecords.find(r=>r.id===id);if(row)row.checked=checked}
function toggleAllHisRows(checked){getVisibleHisRecords().forEach(r=>r.checked=checked);renderPage('collection-batch')}
function getSelectedHis(){return hisRecords.filter(r=>r.checked&&r.validation!=='已处理')}
function exportHisErrors(){toast('已导出错误记录')}
function deleteSelectedHis(){const selected=getSelectedHis();if(!selected.length){toast('请先选择要删除的临时数据','error');return}selected.forEach(r=>r.validation='已处理');renderPage('collection-batch');toast('已删除选中临时数据')}
function deleteAllHis(){getVisibleHisRecords().forEach(r=>r.validation='已处理');renderPage('collection-batch');toast('已删除当前筛选结果')}
function deleteHisRecord(id){const row=hisRecords.find(r=>r.id===id);if(row){row.validation='已处理';row.checked=false;renderPage('collection-batch');toast('临时数据已删除')}}
function hisBatchUpload(){
const checked=hisRecords.filter(r=>r.checked);
if(checked.length===0){toast('请先选择要上传的记录','error');return}
const passed=checked.filter(r=>r.validation==='通过');
const failed=checked.filter(r=>r.validation!=='通过');
if(passed.length===0){toast('选中的记录均未通过校验，无法上传','error');return}
const passedIds=passed.map(r=>r.id);
for(let i=hisRecords.length-1;i>=0;i--){if(passedIds.includes(hisRecords[i].id))hisRecords.splice(i,1)}
hisRecords.forEach(r=>r.checked=false);
renderPage('collection-batch');
let msg='上传成功 '+passed.length+' 条，已进入报告卡列表';
if(failed.length>0)msg+='；'+failed.length+' 条未通过校验已保留';
toast(msg)
}
function hisBatchDelete(){const checked=hisRecords.filter(r=>r.checked);if(checked.length===0){toast('请先选择要删除的记录','error');return}showConfirm('批量删除','确定要删除选中的 '+checked.length+' 条记录吗？删除后不可恢复。',()=>{const ids=checked.map(r=>r.id);for(let i=hisRecords.length-1;i>=0;i--){if(ids.includes(hisRecords[i].id))hisRecords.splice(i,1)}renderPage('collection-batch');toast('已删除 '+checked.length+' 条记录')})}

function renderCardEntryForm(){const errors=window.editCardErrors||[];const isEdit=!!window.editCardId;const errorBlock=errors.length?'<div class="entry-alert" style="background:#fee2e2;border-color:#fca5a5;margin-bottom:14px"><div class="entry-alert-title" style="color:#b91c1c">⚠ 校验错误：'+(isEdit?window.editCardId+' - '+window.editCardData.name:'当前报告卡')+'</div><ol style="margin:8px 0 0 18px;color:#7f1d1d;font-size:13px;line-height:1.8">'+errors.map(e=>'<li><strong style="color:#b91c1c">['+stepName(e.step)+'] '+e.field+'：</strong>'+e.msg+(e.field&&e.field!=='系统校验'?' <a href="javascript:void(0)" onclick="jumpToErrorField('+e.step+',this)" data-field="'+e.field+'" style="color:var(--primary);text-decoration:underline">→ 立即定位</a>':'')+'</li>').join('')+'</ol></div>':'';return errorBlock+`<div class="entry-alert"><div class="entry-alert-title">⚠ 提示！</div><ol><li>表单界面标题中带红色 <span class="required">*</span> 的提示为必填 / 选项，黄色 <span class="conditional-required">*</span> 为条件触发必填；</li><li>"身份证号码 中"性别、出生年月" 必须任填 / 选其一，二者不能同时为空；</li><li>三个 Tab 标签（发病基本信息、肿瘤报告信息与随访报告信息）必须同时完成填写才允许提交。</li></ol></div><div class="panel entry-form-panel"><div class="panel-body"><div class="entry-step-tabs" id="cardEntryTabs"><div class="step-tabs-inner"><button class="step-btn active" onclick="goEntryStep(0)"><span class="step-index">1</span><span>发病人口信息</span></button><button class="step-btn" onclick="goEntryStep(1)"><span class="step-index">2</span><span>肿瘤报告信息</span></button><button class="step-btn" onclick="goEntryStep(2)"><span class="step-index">3</span><span>随访报告信息</span></button></div></div>${renderEntryStepOne()}${renderEntryStepTwo()}${renderEntryStepThree()}<div class="form-actions"><button class="btn btn-ghost" id="entryPrevBtn" onclick="goEntryStep(entryStep - 1)">上一步</button><button class="btn btn-primary" id="entryNextBtn" onclick="nextEntryStep()">下一步</button><button class="btn btn-primary" id="entrySubmitBtn" style="display:none" onclick="submitEntryForm()">`+(isEdit?'保存修改':'提交')+`</button function markInvalid(el,label,msg){const group=el.closest('.form-group');if(!group)return;group.classList.add('invalid');if(!group.querySelector('.field-error')){const err=document.createElement('div');err.className='field-error';err.textContent=msg||('请填写' + label);group.appendChild(err)}}
function validateEntryStep(step=entryStep,showPass=false){const section=getEntrySections()[step];if(!section)return true;let firstInvalid=null;clearEntryErrors(section);section.querySelectorAll('[data-required]').forEach(el=>{if(!el.value||isPlaceholderValue(el)){markInvalid(el,el.dataset.required||'必填项');if(!firstInvalid)firstInvalid=el}});if(firstInvalid){firstInvalid.focus?.();toast('请先完善当前步骤的必填项','error');return false}if(showPass)toast('当前步骤校验通过');return true}
function goEntryStep(target,silent=false){const sections=getEntrySections();if(!sections.length)return;if(target<0||target>=sections.length)return;if(target>entryStep&&!silent)validateEntryStep(entryStep);entryStep=target;sections.forEach((section,index)=>section.classList.toggle('active',index===entryStep));document.querySelectorAll('#cardEntryTabs .step-btn').forEach((tab,index)=>{tab.classList.toggle('active',index===entryStep);tab.classList.toggle('done',index<entryStep)});const prev=document.getElementById('entryPrevBtn');const next=document.getElementById('entryNextBtn');const submit=document.getElementById('entrySubmitBtn');if(prev)prev.style.visibility=entryStep===0?'hidden':'visible';if(next)next.style.display=entryStep===sections.length-1?'none':'inline-flex';if(submit)submit.style.display=entryStep===sections.length-1?'inline-flex':'none';document.getElementById('mainContent')?.scrollTo({top:0,behavior:silent?'auto':'smooth'})}

function submitEntryForm(){const sections=getEntrySections();for(let s=0;s<sections.length;s++){if(!validateEntryStep(s)){goEntryStep(s,true);return}}const logicErrors=validateEntryLogic();if(logicErrors.length>0){logicErrors.forEach(err=>{if(err.el)markInvalid(err.el,err.field,err.msg)});showEntryLogicErrors(logicErrors);goEntryStep(logicErrors[0].step,true);toast('存在 '+logicErrors.length+' 项逻辑校验错误，请修正后再提交','error');return}const oldLogicErrors=document.getElementById('entryLogicErrors');if(oldLogicErrors)oldLogicErrors.remove();if(window.editCardId){const remainErrors=(window.editCardErrors||[]).filter(e=>e.field!=='系统校验');if(remainErrors.length>0){showConfirm('修改保存','当前仍有 '+remainErrors.length+' 项校验错误未处理，保存后错误信息将保留至下次校对。是否继续保存？',()=>{toast('报告卡 '+window.editCardId+' 修改已保存');setTimeout(()=>navigateTo('datamgmt-card'),800)})}else{toast('报告卡 '+window.editCardId+' 修改已保存');setTimeout(()=>navigateTo('datamgmt-card'),800)}}else{toast('报告卡提交成功（已通过全部逻辑校验）')}}

function findEntryField(label){const groups=document.querySelectorAll('.entry-form-panel .form-group');for(const grp of groups){const labelEl=grp.querySelector('label');if(labelEl&&labelEl.textContent.replace(/[*\s]/g,'').indexOf(label)===0){const ctrl=grp.querySelector('input,select,textarea');if(ctrl)return ctrl}}return null}
function entryVal(label){const el=findEntryField(label);return el?el.value.trim():''}
function idCardChecksum(id){if(!/^\d{17}[\dXx]$/.test(id))return false;const w=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2],codes='10X98765432';let sum=0;for(let i=0;i<17;i++)sum+=parseInt(id[i],10)*w[i];return codes[sum%11]===id[17].toUpperCase()}
function validateEntryLogic(){const errors=[];const stepOf=el=>{const sec=el.closest('.entry-section');return sec?Number(sec.dataset.step||0):0};
const add=(field,msg,el)=>errors.push({field,msg,el,step:el?stepOf(el):0});
const id=entryVal('身份证号'),idEl=findEntryField('身份证号');
const sex=entryVal('性别'),sexEl=findEntryField('性别');
const birth=entryVal('出生日期'),birthEl=findEntryField('出生日期');
if(id){if(!idCardChecksum(id)){add('身份证号','身份证号校验位不通过（ISO 7064 MOD-11）',idEl)}else{const idSex=parseInt(id[16],10)%2===1?'男':'女';if(sex&&sex!=='不详'&&sex!==idSex)add('性别','性别与身份证号第 17 位不一致（身份证推导为'+idSex+'）',sexEl||idEl);const idBirth=id.slice(6,10)+'-'+id.slice(10,12)+'-'+id.slice(12,14);if(birth&&birth!==idBirth)add('出生日期','出生日期与身份证号不一致（身份证推导为'+idBirth+'）',birthEl||idEl)}}
const diag=entryVal('确诊日期'),diagEl=findEntryField('确诊日期');
const report=entryVal('报告日期'),reportEl=findEntryField('报告日期');
const death=entryVal('死亡日期'),deathEl=findEntryField('死亡日期');
const lastTouch=entryVal('最后接触日期'),lastTouchEl=findEntryField('最后接触日期');
if(birth&&diag&&diag<=birth)add('确诊日期','确诊日期不可早于或等于出生日期',diagEl);
if(diag&&report&&report<diag)add('报告日期','报告日期不可早于确诊日期',reportEl);
if(diag&&death&&death<diag)add('死亡日期','死亡日期不可早于确诊日期',deathEl);
if(diag&&lastTouch&&lastTouch<diag)add('最后接触日期','最后接触日期不可早于确诊日期',lastTouchEl);
if(birth&&diag){const ageAtDiag=(new Date(diag)-new Date(birth))/31557600000;if(ageAtDiag<0||ageAtDiag>110)add('确诊日期','确诊时年龄异常（'+Math.floor(ageAtDiag)+' 岁），请核对出生/确诊日期',diagEl)}
const topo=entryVal('发病部位'),topoEl=findEntryField('发病部位');
const femaleOnly=['子宫','宫颈','卵巢','输卵管','阴道','外阴'],maleOnly=['前列腺','睾丸','阴茎'];
if(sex==='男'&&femaleOnly.some(k=>topo.includes(k)))add('发病部位','性别为男，不应出现女性特有部位「'+topo+'」',topoEl);
if(sex==='女'&&maleOnly.some(k=>topo.includes(k)))add('发病部位','性别为女，不应出现男性特有部位「'+topo+'」',topoEl);
const icd10=entryVal('ICD10'),icd10El=findEntryField('ICD10');
if(icd10&&!/^[CD]\d{2}(\.\d{1,2})?$/i.test(icd10))add('ICD10','ICD-10 编码格式不合法（如 C34.9）',icd10El);
const topoCode=entryVal('肿瘤解剖学部位代码'),topoCodeEl=document.getElementById('entry-icdo3-topo')||findEntryField('肿瘤解剖学部位代码');
if(topoCode&&!/^C\d{2}(\.\d{1,2})?$/i.test(topoCode))add('肿瘤解剖学部位代码','ICD-O-3 部位代码格式不合法（如 C34.9）',topoCodeEl);
const morphCode=entryVal('肿瘤形态学代码'),morphCodeEl=document.getElementById('entry-icdo3-morph')||findEntryField('肿瘤形态学代码');
if(morphCode&&!/^\d{4}\/[012369]$/.test(morphCode))add('肿瘤形态学代码','ICD-O-3 形态学代码格式不合法（如 8140/3）',morphCodeEl);
return errors}
function showEntryLogicErrors(errors){const old=document.getElementById('entryLogicErrors');if(old)old.remove();if(!errors.length)return;const panel=document.querySelector('.entry-form-panel');if(!panel)return;const div=document.createElement('div');div.className='entry-alert';div.id='entryLogicErrors';div.style.background='#fee2e2';div.style.borderColor='#fca5a5';div.style.marginBottom='14px';div.innerHTML='<div class="entry-alert-title" style="color:#b91c1c">⚠ 逻辑校验未通过（'+errors.length+' 项）</div><ol style="margin:8px 0 0 18px;color:#7f1d1d;font-size:13px;line-height:1.8">'+errors.map((err,i)=>'<li><strong style="color:#b91c1c">['+stepName(err.step)+'] '+err.field+'：</strong>'+err.msg+' <a href="javascript:void(0)" onclick="jumpToLogicError('+i+')" style="color:var(--primary);text-decoration:underline">→ 定位</a></li>').join('')+'</ol>';panel.insertBefore(div,panel.firstChild);window.entryLogicErrorList=errors}

let newsState={mode:'list',editingId:null,filters:{category:'全部',status:'全部',keyword:''}};
let noticeCenterState={keyword:'',category:'全部',selectedId:null};
function noticeCenterFilterChange(){
  noticeCenterState.keyword=(document.getElementById('noticeCenterKeyword')?.value||'').trim();
  document.getElementById('pageContainer').innerHTML=renderNoticeCenter();
  const input=document.getElementById('noticeCenterKeyword');
  if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}
}
function noticeCenterSetCategory(category){
  noticeCenterState.category=category;
  noticeCenterState.selectedId=null;
  navigateTo('notice-center');
}
function noticeCenterResetFilter(){
  noticeCenterState={keyword:'',category:'全部',selectedId:null};
  navigateTo('notice-center');
}
function noticeCenterOpen(id){
  const item=newsData.find(r=>r.id===id);
  if(!item)return;
  noticeCenterState.selectedId=id;
  navigateTo('notice-center-detail');
}
function noticeCenterBack(){
  noticeCenterState.selectedId=null;
  navigateTo('notice-center');
}
function noticeCenterCategoryTone(category){
  if(category==='通知公告')return 'badge-info';
  if(category==='政策法规')return 'badge-warning';
  if(category==='行业动态')return 'badge-success';
  return 'badge-muted';
}
function renderNoticeCenter(){
  const categories=['全部','通知公告','政策法规','行业动态','健康科普'];
  const published=newsData.filter(r=>r.status==='enabled')
    .sort((a,b)=>String(b.publishDate).localeCompare(String(a.publishDate)));
  const selected=noticeCenterState.selectedId?published.find(r=>r.id===noticeCenterState.selectedId):null;
  if(selected)return renderNoticeDetail(selected,published);
  const kw=noticeCenterState.keyword.toLowerCase();
  const notices=published.filter(r=>{
    if(noticeCenterState.category!=='全部'&&r.category!==noticeCenterState.category)return false;
    if(!kw)return true;
    return r.title.toLowerCase().includes(kw)||r.subtitle.toLowerCase().includes(kw)||r.source.toLowerCase().includes(kw)||r.author.toLowerCase().includes(kw);
  });
  const latest=published[0];
  const noticeCount=published.filter(r=>r.category==='通知公告').length;
  const rows=notices.length?notices.map(r=>{
    const preview=String(r.content).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').slice(0,150);
    return '<button type="button" class="notice-center-card" onclick="noticeCenterOpen('+r.id+')">'+
      '<span class="notice-center-card-head"><span class="badge '+noticeCenterCategoryTone(r.category)+'">'+r.category+'</span>'+
      (latest&&latest.id===r.id?'<span class="badge badge-info">最新</span>':'')+'</span>'+
      '<strong class="notice-center-card-title">'+r.title+'</strong>'+
      '<span class="notice-center-card-desc">'+r.subtitle+'　'+preview+'…</span>'+
      '<span class="notice-center-card-foot"><span class="notice-center-card-meta"><span>'+r.source+'</span><span>'+r.author+'</span><span>'+r.publishDate+'</span></span>'+
      '<span class="notice-center-card-action">查看详情 ›</span></span></button>';
  }).join(''):'<div class="notice-center-empty">暂无符合条件的公告</div>';
  return '<div class="notice-center-page">'+
    '<div class="notice-center-toolbar"><div class="notice-center-categories">'+
    categories.map(c=>'<button type="button" class="notice-center-category'+(noticeCenterState.category===c?' is-active':'')+'" onclick="noticeCenterSetCategory(\''+c+'\')">'+c+'</button>').join('')+
    '</div><div class="notice-center-search"><input type="text" id="noticeCenterKeyword" placeholder="搜索标题 / 副标题 / 来源 / 作者" value="'+noticeCenterState.keyword+'" oninput="autoQuery(noticeCenterFilterChange)"></div>'+
    '<button type="button" class="btn btn-outline btn-sm" onclick="noticeCenterResetFilter()">重置</button></div>'+
    '<div class="notice-center-grid">'+rows+'</div>'+
    '</div>';
}
function renderNoticeDetail(item,published){
  const index=published.findIndex(r=>r.id===item.id);
  const prev=published[index+1];
  const next=published[index-1];
  return '<div class="notice-detail-page">'+
    '<div class="notice-detail-topbar"><button type="button" class="btn btn-ghost btn-sm" onclick="noticeCenterBack()">← 返回公告列表</button>'+
    '<span class="badge '+noticeCenterCategoryTone(item.category)+'">'+item.category+'</span></div>'+
    '<article class="notice-detail-card">'+
    '<div class="notice-detail-head"><span class="badge badge-info">'+item.subtitle+'</span></div>'+
    '<h1 class="notice-detail-title">'+item.title+'</h1>'+
    '<div class="notice-detail-meta"><span>来源：'+item.source+'</span><span>作者：'+item.author+'</span><span>发布日期：'+item.publishDate+'</span></div>'+
    '<div class="notice-detail-content">'+item.content+'</div>'+
    '</article>'+
    '<div class="notice-detail-nav">'+
    (prev?'<button type="button" class="btn btn-outline btn-sm" onclick="noticeCenterOpen('+prev.id+')">上一篇：'+prev.title+'</button>':'<span></span>')+
    (next?'<button type="button" class="btn btn-outline btn-sm" onclick="noticeCenterOpen('+next.id+')">下一篇：'+next.title+'</button>':'<span></span>')+
    '</div></div>';
}

function getAddressCurrentChildren(){let nodes=addressData;for(const id of addressState.path){const parent=nodes.find(n=>n.id===id);if(!parent||!parent.children)return[];nodes=parent.children}return nodes}
function getAddressBreadcrumb(){const crumbs=[];let nodes=addressData;for(const id of addressState.path){const node=nodes.find(n=>n.id===id);if(!node)break;crumbs.push({name:node.name,id:id});nodes=node.children||[]}return crumbs}

function findAddressParent(id,nodes=addressData,parent=null){for(const node of nodes){if(node.id===id)return parent;if(node.children){const found=findAddressParent(id,node.children,node);if(found!==null)return found}}return null}

function roleToggleGroup(gi){const body=document.getElementById('rolePermGroup_'+gi);const arrow=document.getElementById('rolePermArrow_'+gi);if(!body)return;const isCollapsed=body.classList.contains('collapsed');body.classList.toggle('collapsed',!isCollapsed);if(arrow)arrow.classList.toggle('collapsed',!isCollapsed)}
function roleToggleGroupAll(gi){const cbs=document.querySelectorAll('#rolePermGroup_'+gi+' .role-perm-cb');const groupCb=document.querySelector('.role-perm-group-cb[data-gi="'+gi+'"]');if(!groupCb)return;const checked=groupCb.checked;cbs.forEach(cb=>cb.checked=checked);rolePermUpdateGroup(gi)}
function rolePermUpdateGroup(gi){const group=roleMenuTree[gi];const cbs=document.querySelectorAll('#rolePermGroup_'+gi+' .role-perm-cb');const checkedCount=Array.from(cbs).filter(cb=>cb.checked).length;const allChecked=checkedCount===group.children.length;const groupCb=document.querySelector('.role-perm-group-cb[data-gi="'+gi+'"]');const head=document.querySelector('.role-perm-group[data-gi="'+gi+'"] .role-perm-group-head');if(groupCb){groupCb.checked=allChecked;groupCb.removeAttribute('data-partial');if(checkedCount>0&&!allChecked)groupCb.setAttribute('data-partial','1')}if(head){head.className='role-perm-group-head '+(allChecked?'all-checked':checkedCount>0?'partial':'');const countEl=head.querySelector('.role-perm-group-count');if(countEl)countEl.textContent=checkedCount+'/'+group.children.length}}

<script>
/* Task-oriented analysis workspaces. Kept separate from the legacy prototype so other modules retain their behavior. */
const legacyRenderPage = renderPage;
const analysisWorkspaceState = {
  page: 'analysis-burden', event: '发病', metric: '数量', dimension: '年龄组',

};
const analysisWorkspaceNav = [
  { id: 'analysis-burden', label: '流行病学分析', desc: 'KPI + 图 + 表明细：发病/死亡、数量/率、部位与年龄' },

];
function awNum(n) { return Math.round(n).toLocaleString('zh-CN'); }
function awRate(n, d, suffix) { return d ? (n / d * (suffix === '%' ? 100 : 100000)).toFixed(2) + (suffix || '') : '人口分母缺失'; }
function awSegment(items, current, fn) { return '<div class="analysis-nav-pills">' + items.map(function (item) { var value = typeof item === 'string' ? item : item.value; var label = typeof item === 'string' ? item : item.label; return '<button type="button" class="analysis-nav-pill' + (value === current ? ' active' : '') + '" onclick="' + fn + '(\'' + value + '\')">' + label + '</button>'; }).join('') + '</div>'; }
function awNav() { return '<div class="analysis-nav-bar"><div class="analysis-nav-groups"><div class="analysis-nav-group"><div class="analysis-nav-group-label">数据分析</div><div class="analysis-nav-pills">' + analysisWorkspaceNav.map(function (item) { return '<button type="button" title="' + item.desc + '" class="analysis-nav-pill' + (analysisWorkspaceState.page === item.id ? ' active' : '') + '" onclick="awSwitch(\'' + item.id + '\')">' + item.label + '</button>'; }).join('') + '</div></div></div></div>'; }
function awFilter(label, options) { return '<div class="form-group"><label>' + label + '</label><select>' + options.map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select></div>'; }
function awScope() { return '<div class="analysis-result-info" style="border-top:1px solid var(--border);margin-top:14px"><span><strong>统计范围：</strong>江西省 / 患者行政区划 / 有效报卡</span><span><strong>时间范围：</strong>2025年度</span></div><div style="font-size:12px;color:#64748b;padding:0 0 12px">人口分母：2025年分年龄、分性别人群数据　·　指标单位：人数；率为每10万人　·　数据截止：2026-07-16</div>'; }
function awPeriodControl() { var p = analysisWorkspaceState.period; var extra = p === '半年' ? awFilter('半年', ['上半年', '下半年']) : p === '季度' ? awFilter('季度', ['第一季度', '第二季度', '第三季度', '第四季度']) : p === '月份' ? awFilter('月份', ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月']) : p === '自定义截止日' ? '<div class="form-group"><label>截止日期</label><input type="date" value="2025-12-31"></div>' : ''; return '<div class="form-group"><label>统计周期</label><select onchange="awChangePeriod(this.value)">' + ['年度', '半年', '季度', '月份', '自定义截止日'].map(function (x) { return '<option' + (x === p ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div>' + extra; }
function awChangePeriod(value) { analysisWorkspaceState.period = value; renderPage(analysisWorkspaceState.page); }
function awQueryBar(metricBar) {
  return '<div class="analysis-filter-card">' +
    (metricBar ? '<div class="analysis-metric-bar">' + metricBar + '</div>' : '') +
    '<div class="analysis-filter-grid">' +
      awFilter('行政区划', ['江西省', '南昌市', '赣州市', '九江市']) +
      awFilter('归属口径', ['患者行政区划', '按报告单位所属区划统计']) +
      awFilter('报卡范围', ['有效报卡', '全部报卡']) +
      awFilter('时间口径', ['确诊日期', '上报日期', '死亡日期']) +
      awPeriodControl() +
      awFilter('年份', ['2025', '2024', '2023']) +
      awFilter('性别', ['合计', '男', '女']) +
    '</div>' +
    '<div class="analysis-filter-actions"><button class="btn btn-ghost btn-sm" onclick="toast(\'已重置查询条件\')">重置</button><button class="btn btn-primary btn-sm" onclick="awRunQuery()">查询</button><button class="btn btn-outline btn-sm" onclick="awExport()">导出</button></div>' +
  '</div>';
}
function awRunQuery() { analysisWorkspaceState.queried = true; renderPage(analysisWorkspaceState.page); toast('已按当前筛选条件更新结构'); }
function awExport() { showConfirm('导出确认', '将导出当前统计范围、全部筛选条件和 ' + (analysisWorkspaceState.page === 'analysis-burden' ? '13' : '6') + ' 条结果记录。', function () { toast('导出文件已生成，包含“查询条件”页签'); }); }
function awSwitch(page) { analysisWorkspaceState.page = page; renderPage(page); }
function awSet(key, value) { analysisWorkspaceState[key] = value; renderPage(analysisWorkspaceState.page); }
function awMetricHint(title, formula) { return '<span title="分子 / 分母 / 公式：' + formula + '" style="cursor:help;color:#667085">' + title + ' ⓘ</span>'; }
function renderBurdenWorkspace() {
  var s = analysisWorkspaceState, population = 9823000, ageGroups = ['0-14岁', '15-44岁', '45-59岁', '60-74岁', '75岁及以上'];
  var sites = [{ name: 'C50 乳房', inc: 1268, death: 218, mv: 1148, dco: 16, ub: 9 }, { name: 'C34 肺', inc: 1562, death: 796, mv: 1132, dco: 101, ub: 21 }, { name: 'C16 胃', inc: 1017, death: 372, mv: 745, dco: 61, ub: 18 }, { name: 'C18 结肠', inc: 846, death: 214, mv: 669, dco: 28, ub: 10 }, { name: 'C22 肝', inc: 734, death: 348, mv: 468, dco: 82, ub: 14 }];
  var totalInc = sites.reduce(function (n, r) { return n + r.inc; }, 0), totalDeath = sites.reduce(function (n, r) { return n + r.death; }, 0);
  var controls = '<div class="form-group"><label>事件</label>' + awSegment(['发病', '死亡'], s.event, "awSet.bind(null,'event')") + '</div><div class="form-group"><label>指标</label>' + awSegment(['数量', '粗率'], s.metric, "awSet.bind(null,'metric')") + '</div><div class="form-group"><label>维度</label>' + awSegment(['年龄组', '部位'], s.dimension, "awSet.bind(null,'dimension')") + '</div>';
  var selectedTotal = s.event === '发病' ? totalInc : totalDeath;
  var kpis = '<div class="analysis-kpi-row"><div class="analysis-kpi"><div class="analysis-kpi-label">总' + s.event + '数</div><div class="analysis-kpi-value">' + awNum(selectedTotal) + '</div><div class="analysis-kpi-sub">人数</div></div><div class="analysis-kpi"><div class="analysis-kpi-label">总体粗率</div><div class="analysis-kpi-value">' + awRate(selectedTotal, population) + '</div><div class="analysis-kpi-sub">每10万人</div></div><div class="analysis-kpi"><div class="analysis-kpi-label">男女性别比</div><div class="analysis-kpi-value">1.14</div><div class="analysis-kpi-sub">用/ 女/div></div><div class="analysis-kpi"><div class="analysis-kpi-label">最近数据时间</div><div class="analysis-kpi-value" style="font-size:16px">2025-12-31</div><div class="analysis-kpi-sub">当前筛选范围</div></div></div>';
  var result = '';
  if (s.dimension === '年龄组') {
    var rows = sites.map(function (site, i) { var vals = ageGroups.map(function (_, j) { return Math.round((s.event === '发病' ? site.inc : site.death) * [0.03, 0.12, 0.25, 0.39, 0.21][j]); }); var valueCells = vals.map(function (v, j) { var pop = population * [.16, .37, .22, .17, .08][j]; return '<td style="text-align:right">' + (s.metric === '数量' ? awNum(v) : awRate(v, pop)) + '</td>'; }).join(''); var sum = vals.reduce(function (a, b) { return a + b; }, 0); return '<tr><td class="sticky-col-1 row-header">' + site.name + '</td><td style="text-align:right">' + (s.metric === '数量' ? awNum(sum) : awRate(sum, population)) + '</td>' + valueCells + '</tr>'; }).join('');
    result = '<div class="analysis-table-scroll"><table class="data-table analysis-table"><thead><tr><th class="sticky-col-1">ICD分类</th><th>' + (s.metric === '数量' ? '合计人数' : '总体粗率') + '</th>' + ageGroups.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr></thead><tbody>' + rows + '<tr class="total-row"><td class="sticky-col-1 row-header">合计</td><td>' + (s.metric === '数量' ? awNum(selectedTotal) : awRate(selectedTotal, population)) + '</td><td colspan="5">合计率按总事件数 / 总人口重新计算，不累加年龄别率</td></tr></tbody></table></div>';
  } else {

    var rows2 = sites.map(function (r) { return '<tr><td class="sticky-col-1 row-header">' + r.name + '</td>' + (burdenVisible ? '<td>' + awNum(r.inc) + '</td><td>' + awRate(r.inc, population) + '</td><td>' + awNum(r.death) + '</td><td>' + awRate(r.death, population) + '</td><td>' + (r.death / r.inc).toFixed(2) + '</td>' : '') + (qualityVisible ? '<td>' + awRate(r.mv, r.inc, '%') + '</td><td>' + awRate(r.dco, r.inc, '%') + '</td><td>' + awRate(r.ub, r.inc, '%') + '</td>' : '') + '</tr>'; }).join('');
    result = '<div style="display:flex;gap:12px;align-items:center;margin:10px 0 12px"><label><input type="checkbox" ' + (burdenVisible ? 'checked' : '') + ' onchange="analysisWorkspaceState.burdenColumns=this.checked;renderPage(\'analysis-burden\')"> 疾病负担列组</label><label><input type="checkbox" ' + (qualityVisible ? 'checked' : '') + ' onchange="analysisWorkspaceState.qualityColumns=this.checked;renderPage(\'analysis-burden\')"> 登记质量列组</label></div><div class="analysis-table-scroll"><table class="data-table analysis-table"><thead><tr><th class="sticky-col-1">ICD部位</th>' + (burdenVisible ? '<th>发病数</th><th>发病粗率</th><th>死亡数</th><th>死亡粗率</th><th>M/I</th>' : '') + (qualityVisible ? '<th>MV%</th><th>DCO%</th><th>UB%</th>' : '') + '</tr></thead><tbody>' + rows2 + '<tr class="total-row"><td class="sticky-col-1 row-header">合计</td>' + (burdenVisible ? '<td>' + awNum(totalInc) + '</td><td>' + awRate(totalInc, population) + '</td><td>' + awNum(totalDeath) + '</td><td>' + awRate(totalDeath, population) + '</td><td>' + (totalDeath / totalInc).toFixed(2) + '</td>' : '') + (qualityVisible ? '<td colspan="3">质量比例按汇总分子 / 汇总发病数计算</td>' : '') + '</tr></tbody></table></div>';

    var fields = ['身份证号', '联系电话', '联系人', '职业', '分期', '治疗信息'];
    var groups = awGroups().map(function (group, index) {
      var total = 1220 - index * 126, logic = 39 + index * 7;
      return { name: group.n, total: total, logic: logic, outer: +(33 + index * 3) / 10, baseMiss: +(26 + index * 4) / 10, tumMiss: +(44 + index * 6) / 10, warn: +(18 + index * 5) / 10, fields: fields.map(function (_, fi) { return +(9 + index * 3 + fi * 2) / 10; }) };
    });
    var avg = function (key) { return groups.reduce(function (s, g) { return s + g[key]; }, 0) / groups.length; };
    var gauges = [{ label: '逻辑问题率', value: avg('logic') / (groups[0].total / 100), warn: 3, bad: 5 }, { label: '基本信息缺失', value: avg('baseMiss'), warn: 3, bad: 5 }, { label: '肿瘤信息缺失', value: avg('tumMiss'), warn: 3, bad: 6 }, { label: '警告卡比例', value: avg('warn'), warn: 3, bad: 5 }];
    gauges[0].value = +(groups.reduce(function (s, g) { return s + g.logic; }, 0) / groups.reduce(function (s, g) { return s + g.total; }, 0) * 100).toFixed(2);
    var topAbnormal = groups.map(function (g) { return { name: g.name, score: g.baseMiss + g.tumMiss + g.warn }; }).sort(function (a, b) { return b.score - a.score; });
    var filtered = analysisWorkspaceState.onlyAbnormal ? groups.filter(function (g) { return g.baseMiss >= 3 || g.tumMiss >= 3 || g.warn >= 3; }) : groups;
    var rows = filtered.map(function (g) {
      var hl = analysisWorkspaceState.highlightKey === g.name ? ' class="row-hl"' : '';
      return '<tr' + hl + '><td class="sticky-col-1 row-header">' + g.name + '</td><td>' + awNum(g.total) + '</td><td>' + awNum(g.total - g.logic) + ' / ' + awNum(g.logic) + '</td><td>' + g.outer.toFixed(2) + '%</td><td>' + g.baseMiss.toFixed(2) + '%</td><td>' + g.tumMiss.toFixed(2) + '%</td><td>' + g.warn.toFixed(2) + '%</td>' + g.fields.map(function (p) { return '<td>' + p.toFixed(2) + '%</td>'; }).join('') + '</tr>';
    }).join('');
    var viz = '<div class="analysis-viz-grid' + (analysisWorkspaceState.chartsCollapsed ? ' collapsed' : '') + '">' + awGaugePanel(gauges) + awHBarChart('异常对象 Top', topAbnormal, 'score', 'name', '') + '</div>';
    var kpis = '<div class="analysis-kpi-row">' + gauges.map(function (g) { var tone = g.value >= g.bad ? 'quality-tone-bad' : g.value >= g.warn ? 'quality-tone-warn' : 'quality-tone-ok'; return '<div class="analysis-kpi kpi-click" onclick="analysisWorkspaceState.onlyAbnormal=true;renderPage(\'analysis-quality\')"><div class="analysis-kpi-label">' + g.label + '</div><div class="analysis-kpi-value ' + tone + '">' + g.value.toFixed(2) + '%</div></div>'; }).join('') + '</div>';
    return '<div class="panel"><div class="panel-body">' + analysisPanelHead('报卡质量监测', '质量仪表 + 异常排行 + 完整性明细（支持仅看异常）') + simpleAnalysisFilters(true) + awScopeBar() + kpis + awVizToolbar('<label style="font-size:12px;color:#475569"><input type="checkbox" ' + (analysisWorkspaceState.onlyAbnormal ? 'checked' : '') + ' onchange="analysisWorkspaceState.onlyAbnormal=this.checked;renderPage(\'analysis-quality\')"> 仅看异常</label>') + viz + '<div class="analysis-table-scroll"><table class="data-table analysis-table"><thead><tr><th class="sticky-col-1">汇总对象</th><th>卡片总数</th><th>逻辑校验（通过/问题）</th><th>户籍外卡%</th><th>基本信息缺失%</th><th>肿瘤信息缺失%</th><th>警告卡%</th>' + fields.map(function (f) { return '<th>' + f + '%</th>'; }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div></div></div>';
  };
